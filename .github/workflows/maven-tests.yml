name: Java CI/CD Integration Tests Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем исходный код
        uses: actions/checkout@v4

      - name: Устанавливаем Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Запускаем интеграционные тесты
        run: mvn clean test